[[service]]
name = "YouTube"
domains = ["youtube.com", "googlevideo.com", "ytimg.com", "ggpht.com", "youtu.be", "youtube-nocookie.com", "youtubei.googleapis.com", "youtubekids.com", "yt.be"]
probe = ["www.youtube.com"]

# always: goes through the bypass on every network. Discord's site may open while its calls and
# updates are cut, and those cannot be probed without an account.
[[service]]
name = "Discord"
always = true
domains = ["discord.com", "discord.gg", "discordapp.com", "discordapp.net", "discord.media", "discordcdn.com", "discord.dev", "discord.new", "discord.gift", "discordstatus.com", "dis.gd"]
probe = ["discord.com", "gateway.discord.gg"]

[[service]]
name = "Twitch"
domains = ["twitch.tv", "ttvnw.net", "jtvnw.net", "twitchcdn.net"]
probe = ["www.twitch.tv"]

[[service]]
name = "X"
domains = ["x.com", "twitter.com", "twimg.com", "t.co"]
probe = ["x.com"]

[[service]]
name = "Instagram"
domains = ["instagram.com", "cdninstagram.com", "ig.me"]
probe = ["www.instagram.com"]

[[service]]
name = "Rutracker"
domains = ["rutracker.org", "rutracker.net", "rutracker.cc", "t-ru.org"]
probe = ["rutracker.org"]
probe_http = ["rutracker.org"]

[[service]]
name = "Cloudflare"
domains = ["cloudflare.com"]
probe = ["www.cloudflare.com"]

[[service]]
name = "itch.io"
domains = ["itch.io", "itch.zone"]
probe = ["itch.io"]

[[service]]
name = "SoundCloud"
domains = ["soundcloud.com", "sndcdn.com"]

# Hostings where DPI cuts connections at 16-20 KB: the probe downloads a big file, and once it is
# cut, all of the hosting's subnets (resources/ipset-hosting.txt) go through the bypass.
# They work in the background: the window lists only the services people know by name.
[[service]]
name = "Сайты на Linode"
domains = ["linode.com"]
probe = ["speedtest.frankfurt.linode.com"]
path = "/100MB-frankfurt.bin"
ipset = "linode"

[[service]]
name = "Сайты на Vultr"
domains = ["vultr.com"]
probe = ["fra-de-ping.vultr.com"]
path = "/vultr.com.100MB.bin"
ipset = "vultr"

[[service]]
name = "Сайты на Hetzner"
domains = ["hetzner.com", "hetzner.de", "your-server.de"]
probe = ["nbg1-speed.hetzner.com"]
path = "/100MB.bin"
ipset = "hetzner"

[[service]]
name = "Сайты на OVH"
domains = ["ovh.net", "ovh.com", "ovhcloud.com"]
probe = ["proof.ovh.net"]
path = "/files/10Mb.dat"
ipset = "ovh"

# Neural networks. The provider does not cut them: they refuse visitors from Russia themselves, so
# the bypass does nothing for them. Their names are asked from the resolver chosen in the settings
# (see rkn_core::aidns), which answers with the address of its relay. Only the domains listed here
# go there, so nothing as wide as google.com belongs in these lists.
[[service]]
name = "ChatGPT"
kind = "ai"
domains = ["chatgpt.com", "openai.com", "oaiusercontent.com", "oaistatic.com", "sora.com"]
probe = ["chatgpt.com"]

[[service]]
name = "Claude"
kind = "ai"
domains = ["claude.ai", "claude.com", "anthropic.com", "claudeusercontent.com"]
probe = ["claude.ai"]

[[service]]
name = "Gemini"
kind = "ai"
domains = ["gemini.google.com", "aistudio.google.com", "notebooklm.google.com", "labs.google", "ai.google.dev", "generativelanguage.googleapis.com", "alkalimakersuite-pa.clients6.google.com", "webchannel-alkalimakersuite-pa.clients6.google.com", "proactivebackend-pa.googleapis.com", "aisandbox-pa.googleapis.com", "jules.google.com"]
probe = ["gemini.google.com"]

[[service]]
name = "Copilot"
kind = "ai"
domains = ["copilot.microsoft.com", "copilot.com"]
probe = ["copilot.microsoft.com"]

[[service]]
name = "Cursor"
