[package]
name = "rkn-setup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "zapretUI-setup"
path = "src/main.rs"
# The manifest asks for administrator rights, so Windows will not start its test binary.
test = false

[build-dependencies]
embed-resource = "3"

[dependencies]
rkn-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ring = "0.17"
windows = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }
